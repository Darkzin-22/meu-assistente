# Deploy na Fly.io: `fly launch --no-deploy` (aceite este arquivo), depois
# `fly volumes create dados --size 1` e `fly deploy`.
app = "meu-assistente"   # substituído pelo FLY_APP_NAME na publicação automática
primary_region = "gru"   # São Paulo

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  DEFAULT_TIMEZONE = "America/Sao_Paulo"

[[mounts]]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # O servidor precisa ficar SEMPRE ligado para enviar os lembretes no horário.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
