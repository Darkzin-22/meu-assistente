# Publica a versão com servidor (Jarvis) no Fly.io a cada envio para a branch main.
# Requer o segredo FLY_API_TOKEN no GitHub (Settings › Secrets and variables › Actions).
# Sem o segredo, o processo apenas avisa e não faz nada (não dá erro).
name: Publicar no Fly.io (Jarvis)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publicar-fly

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP_NAME || 'jarvis-eduardo-2026' }}
    steps:
      - name: Conferir configuração
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::Publicação no Fly.io pulada: falta o segredo FLY_API_TOKEN."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: steps.check.outputs.ok == 'true'
        run: npm ci

      - name: Testes (não publica se algo falhar)
        if: steps.check.outputs.ok == 'true'
        run: npm test

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ok == 'true'

      - name: Criar o app e o volume de dados (só na primeira vez)
        if: steps.check.outputs.ok == 'true'
        run: |
          if ! flyctl status -a "$FLY_APP" >/dev/null 2>&1; then
            flyctl apps create "$FLY_APP" --org personal
          fi
          if ! flyctl volumes list -a "$FLY_APP" --json | grep -q '"dados"'; then
            flyctl volumes create dados --region gru --size 1 -a "$FLY_APP" --yes
          fi

      - name: Chaves opcionais (IA e transcrição)
        if: steps.check.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set --
          [ -n "$ANTHROPIC_API_KEY" ] && set -- "$@" "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
          [ -n "$GROQ_API_KEY" ] && set -- "$@" "GROQ_API_KEY=$GROQ_API_KEY"
          [ -n "$OPENAI_API_KEY" ] && set -- "$@" "OPENAI_API_KEY=$OPENAI_API_KEY"
          if [ "$#" -gt 0 ]; then flyctl secrets set "$@" --stage -a "$FLY_APP"; else echo "Nenhuma chave opcional — usando interpretador local e voz do aparelho."; fi

      - name: Publicar
        if: steps.check.outputs.ok == 'true'
        run: flyctl deploy --remote-only -a "$FLY_APP"

      - name: Endereço do app
        if: steps.check.outputs.ok == 'true'
        run: |
          echo "### 📱 Jarvis atualizado: https://$FLY_APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
